<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <video id="v1" autoplay muted playsinline loop>
        <source src="video1.mp4" type="video/mp4">
    </video>
    <script>
        const v = document.getElementById('v1');
        // Khi chạm vào màn hình, âm thanh sẽ tự bật
        document.addEventListener('click', () => { v.muted = false; });
        document.addEventListener('touchstart', () => { v.muted = false; });
    </script>
</body>
</html>
